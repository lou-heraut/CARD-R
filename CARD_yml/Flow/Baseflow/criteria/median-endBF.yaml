id: median-endBF
version: "1.0"
authors: []
date: "2026-04-26"

meta:
  en:
    variable: median-endBF
    unit: yearday
    name: Median of the end of base flows
    description: >-
      Median of the dates when 90 % of the annual cumulative base flow
      is reached
    method: |
      1. annual aggregation [09-01, 08-31] - date when the sum of base flow
         (Wallingford) Qb corresponds to 90 % of the total sum
      2. no temporal aggregation - median
    sampling_period: ["09-01", "08-31"]
    topic: "Flow, Baseflow, Seasonality"

  fr:
    variable: mediane-finQB
    unit: "jour de l'année"
    name: Médiane de la fin des écoulements lents
    description: >-
      Médiane des dates à laquelle 90 % du cumul annuel du débit de base
      sont atteints
    method: |
      1. agrégation annuelle [01-09, 31-08] - date à laquelle la somme du
         débit de base (Wallingford) Qb correspond à 90 % de la somme totale
      2. aucune agrégation temporelle - médiane
    sampling_period: ["01-09", "31-08"]
    topic: "Débit, Débit de Base, Saisonnalité"

  global:
    input_vars: Q
    source: >-
      TALLAKSEN, L. et H. VAN LANEN, éd. (2004). Hydrological drought. Processes
      and estimation methods for streamflow and groundwater. Developments in water
      science 48. Netherlands : Elsevier. ISBN : 9780444516886.
    preferred_sampling_period: "09-01"
    is_date: true
    to_normalise: false

process:
  P1:
    funct:
      endBF: [compute_tVolSnowmelt, "Q", {p: 0.9, method: Wal}, true]
    sampling_period: "09-01"
    NApct_lim: 3
    NAyear_lim: 10

  P2:
    funct:
      median-endBF: [circular_median, "endBF", {periodicity: 365.25, skipna: true}]
    time_step: none
