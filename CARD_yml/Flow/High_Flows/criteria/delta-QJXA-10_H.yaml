id: delta-QJXA-10_H
version: "1.0"
authors: []
date: "2026-04-28"

meta:
  en:
    variable: [delta-QJXA-10_H1, delta-QJXA-10_H2, delta-QJXA-10_H3]
    unit: "%"
    name:
      - "Change of annual maximum daily flow with a 10-year return period
         between the near horizon and historical period"
      - "Change of annual maximum daily flow with a 10-year return period
         between the middle horizon and historical period"
      - "Change of annual maximum daily flow with a 10-year return period
         between the distant horizon and historical period"
    description: ""
    method: |
      1. annual aggregation [Month of minimum monthly flows] - maximum
         (extraction from the QJXA series)
      2. no temporal aggregation - calculation of the 10-year return period
         flow with the Gumbel distribution on the historical period and in
         the {horizon} horizon then calculation of the average change
    horizon_labels: {H1: near, H2: middle, H3: distant}
    sampling_period: Month of minimum monthly flows
    topic: "Flow, High Flows, Intensity"

  fr:
    variable: [delta-QJXA-10_H1, delta-QJXA-10_H2, delta-QJXA-10_H3]
    unit: "%"
    name:
      - "Changement du débit journalier maximal annuel de période de retour
         10 ans entre l'horizon proche et la période historique"
      - "Changement du débit journalier maximal annuel de période de retour
         10 ans entre l'horizon moyen et la période historique"
      - "Changement du débit journalier maximal annuel de période de retour
         10 ans entre l'horizon lointain et la période historique"
    description: ""
    method: |
      1. agrégation annuelle [Mois du minimum des débits mensuels] - maximum
         (extraction de la série des QJXA)
      2. aucune agrégation temporelle - calcul du débit de période de retour
         10 ans avec la loi de Gumbel sur la période historique et en horizon
         {horizon} puis calcul du changement moyen
    horizon_labels: {H1: proche, H2: moyen, H3: lointain}
    sampling_period: Mois du minimum des débits mensuels
    topic: "Débit, Hautes Eaux, Intensité"

  global:
    input_vars: Q
    preferred_sampling_period: "09-01"
    palette: ["#452C1A", "#7F4A23", "#B3762A", "#D4B86A", "#EFE0B0",
              "#BCE6DB", "#7ACEB9", "#449C93", "#2A6863", "#193830"]
    horizons:
      H0: ["1976-01-01", "2005-08-31"]
      H1: ["2021-01-01", "2050-12-31"]
      H2: ["2041-01-01", "2070-12-31"]
      H3: ["2070-01-01", "2099-12-31"]

process:
  P1:
    funct:
      QJXA: [maxNA, "Q", {skipna: true}]
    sampling_period:
      type: adaptive
      funct: [min, "Q", {skipna: true}]
    NApct_lim: 3
    NAyear_lim: 10

  P2:
    funct:
      delta-QJXA-10_H1: [get_deltaX, "QJXA", "date",
                         {past: $H0, futur: $H1, to_normalise: true,
                          returnPeriod: 10, waterType: "high"}]
      delta-QJXA-10_H2: [get_deltaX, "QJXA", "date",
                         {past: $H0, futur: $H2, to_normalise: true,
                          returnPeriod: 10, waterType: "high"}]
      delta-QJXA-10_H3: [get_deltaX, "QJXA", "date",
                         {past: $H0, futur: $H3, to_normalise: true,
                          returnPeriod: 10, waterType: "high"}]
    time_step: none
