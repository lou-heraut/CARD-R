id: delta-tQJXA_H
version: "1.0"
authors: []
date: "2026-04-28"

meta:
  en:
    variable: [delta-tQJXA_H1, delta-tQJXA_H2, delta-tQJXA_H3]
    unit: day
    name:
      - "Average change of the date of the annual maximum daily discharge
         between the near horizon and historical period"
      - "Average change of the date of the annual maximum daily discharge
         between the middle horizon and historical period"
      - "Average change of the date of the annual maximum daily discharge
         between the distant horizon and historical period"
    description: ""
    method: |
      1. annual aggregation [Month of minimum monthly flows] - date of maximum
      2. no temporal aggregation - calculation of the average change between
         the historical period and the {horizon} horizon
    horizon_labels: {H1: near, H2: middle, H3: distant}
    sampling_period: Month of minimum monthly flows
    topic: "Flow, High Flows, Seasonality"

  fr:
    variable: [delta-tQJXA_H1, delta-tQJXA_H2, delta-tQJXA_H3]
    unit: jour
    name:
      - "Changement moyen de la date du débit journalier maximal annuel
         entre l'horizon proche et la période historique"
      - "Changement moyen de la date du débit journalier maximal annuel
         entre l'horizon moyen et la période historique"
      - "Changement moyen de la date du débit journalier maximal annuel
         entre l'horizon lointain et la période historique"
    description: ""
    method: |
      1. agrégation annuelle [Mois du minimum des débits mensuels] - date du maximum
      2. aucune agrégation temporelle - calcul du changement moyen entre la
         période historique et l'horizon {horizon}
    horizon_labels: {H1: proche, H2: moyen, H3: lointain}
    sampling_period: Mois du minimum des débits mensuels
    topic: "Débit, Hautes Eaux, Saisonnalité"

  global:
    input_vars: Q
    preferred_sampling_period: "09-01"
    is_date: true
    to_normalise: false
    palette: ["#60265e", "#893687", "#c05fbe", "#dba3da", "#edd1ec",
              "#f6ddd3", "#edbaa7", "#e08765", "#CD5629", "#8f3c1d"]
    horizons:
      H0: ["1976-01-01", "2005-08-31"]
      H1: ["2021-01-01", "2050-12-31"]
      H2: ["2041-01-01", "2070-12-31"]
      H3: ["2070-01-01", "2099-12-31"]

process:
  P1:
    funct:
      tQJXA: [which.maxNA, "Q", true]
    sampling_period:
      type: adaptive
      funct: [min, "Q", {skipna: true}]
    NApct_lim: 3
    NAyear_lim: 10

  P2:
    funct:
      delta-tQJXA_H1: [get_deltaX, "tQJXA", "date",
                       {past: $H0, futur: $H1, to_normalise: false}]
      delta-tQJXA_H2: [get_deltaX, "tQJXA", "date",
                       {past: $H0, futur: $H2, to_normalise: false}]
      delta-tQJXA_H3: [get_deltaX, "tQJXA", "date",
                       {past: $H0, futur: $H3, to_normalise: false}]
    time_step: none
