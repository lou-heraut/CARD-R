id: delta-QNA_H
version: "1.0"
authors: []
date: "2026-04-28"

meta:
  en:
    variable: [delta-QNA_H1, delta-QNA_H2, delta-QNA_H3]
    unit: "%"
    name:
      - Average change of annual minimum of daily discharge between the near horizon and historical period
      - Average change of annual minimum of daily discharge between the middle horizon and historical period
      - Average change of annual minimum of daily discharge between the distant horizon and historical period
    description: ""
    method: ""
    horizon_labels: {H1: near, H2: middle, H3: distant}
    sampling_period: Month of maximum monthly flows
    topic: "Flow, Low Flows, Intensity"

  fr:
    variable: [delta-QNA_H1, delta-QNA_H2, delta-QNA_H3]
    unit: "%"
    name:
      - Changement moyen du minimum annuel du débit journalier entre l'horizon proche et la période historique
      - Changement moyen du minimum annuel du débit journalier entre l'horizon moyen et la période historique
      - Changement moyen du minimum annuel du débit journalier entre l'horizon lointain et la période historique
    description: ""
    method: ""
    horizon_labels: {H1: proche, H2: moyen, H3: lointain}
    sampling_period: Mois du maximum des débits mensuels
    topic: "Débit, Basses Eaux, Intensité"

  global:
    input_vars: Q
    preferred_sampling_period: "01-01"
    to_normalise: false
    palette: ["#452C1A", "#7F4A23", "#B3762A", "#D4B86A", "#EFE0B0",
              "#BCE6DB", "#7ACEB9", "#449C93", "#2A6863", "#193830"]
    horizons:
      H0: ["1976-01-01", "2005-08-31"]
      H1: ["2021-01-01", "2050-12-31"]
      H2: ["2041-01-01", "2070-12-31"]
      H3: ["2070-01-01", "2099-12-31"]

process:
  P1:
    funct:
      QNA: [minNA, "Q", {skipna: true}]
    sampling_period:
      type: adaptive
      funct: [max, "Q", {skipna: true}]
    NApct_lim: 3
    NAyear_lim: 10

  P2:
    funct:
      delta-QNA_H1: [get_deltaX, "QNA", "date", {past: $H0, futur: $H1, to_normalise: false}]
      delta-QNA_H2: [get_deltaX, "QNA", "date", {past: $H0, futur: $H2, to_normalise: false}]
      delta-QNA_H3: [get_deltaX, "QNA", "date", {past: $H0, futur: $H3, to_normalise: false}]
    time_step: none
