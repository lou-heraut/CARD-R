      H2: ["2041-01-01", "2070-12-31"]
      H3: ["2070-01-01", "2099-12-31"]

process:
  P1:
    funct:
      VC10: [rollmean_center, "Q", {k: 10}]
    time_step: none
    keep: all

  P2:
    funct:
      VCN10: [minNA, "VC10", {skipna: true}]
    sampling_period:
      type: adaptive
      funct: [max, "Q", {skipna: true}]
    NApct_lim: 3
    NAyear_lim: 10
    keep: all

  P3:
    funct:
      upLim: [maxNA, "VCN10", {skipna: true}]
    time_step: none
    keep: all

  P4:
    funct:
      startLF: [apply_threshold, "VC10", {lim: upLim, where: "<=", what: first, select: longest}, true]
      centerLF: [apply_threshold, "VC10", {lim: upLim, where: "<=", what: which.minNA, select: longest}, true]
      endLF: [apply_threshold, "VC10", {lim: upLim, where: "<=", what: last, select: longest}, true]
      dtLF: [apply_threshold, "VC10", {lim: upLim, where: "<=", what: length, select: longest}]
      vLF: [compute_VolDef, "VC10", {select: longest, upLim: upLim}]
    sampling_period:
      type: adaptive
      funct: [max, "Q", {skipna: true}]
    NApct_lim: 3

  P5:
    funct:
      delta-startLF_H1: [get_deltaX, "startLF", "date", {past: $H0, futur: $H1, to_normalise: false}]
      delta-startLF_H2: [get_deltaX, "startLF", "date", {past: $H0, futur: $H2, to_normalise: false}]
      delta-startLF_H3: [get_deltaX, "startLF", "date", {past: $H0, futur: $H3, to_normalise: false}]
      delta-centerLF_H1: [get_deltaX, "centerLF", "date", {past: $H0, futur: $H1, to_normalise: false}]
      delta-centerLF_H2: [get_deltaX, "centerLF", "date", {past: $H0, futur: $H2, to_normalise: false}]
      delta-centerLF_H3: [get_deltaX, "centerLF", "date", {past: $H0, futur: $H3, to_normalise: false}]
      delta-endLF_H1: [get_deltaX, "endLF", "date", {past: $H0, futur: $H1, to_normalise: false}]
      delta-endLF_H2: [get_deltaX, "endLF", "date", {past: $H0, futur: $H2, to_normalise: false}]
      delta-endLF_H3: [get_deltaX, "endLF", "date", {past: $H0, futur: $H3, to_normalise: false}]
      delta-dtLF_H1: [get_deltaX, "dtLF", "date", {past: $H0, futur: $H1, to_normalise: false}]
      delta-dtLF_H2: [get_deltaX, "dtLF", "date", {past: $H0, futur: $H2, to_normalise: false}]
      delta-dtLF_H3: [get_deltaX, "dtLF", "date", {past: $H0, futur: $H3, to_normalise: false}]
      delta-vLF_H1: [get_deltaX, "vLF", "date", {past: $H0, futur: $H1, to_normalise: false}]
      delta-vLF_H2: [get_deltaX, "vLF", "date", {past: $H0, futur: $H2, to_normalise: false}]
      delta-vLF_H3: [get_deltaX, "vLF", "date", {past: $H0, futur: $H3, to_normalise: false}]
    time_step: none
