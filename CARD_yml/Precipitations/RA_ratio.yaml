id: RA_ratio
version: "1.0"
authors: []
date: "2026-04-26"

meta:
  en:
    variable: RA_ratio
    unit: without unit
    name: Precipitation ratio
    description: ""
    method: ""
    sampling_period: ["09-01", "08-31"]
    topic: "Precipitations, Moderate, Ratio"

  fr:
    variable: RA_ratio
    unit: sans unité
    name: Ratio des précipitations
    description: ""
    method: ""
    sampling_period: ["01-09", "31-08"]
    topic: "Précipitations, Modérée, Ratio"

  global:
    input_vars: "R, Rl, Rs"
    to_normalise: false

process:
  P1:
    funct:
      RA:  [sumNA, "R",  {skipna: true}]
      RAl: [sumNA, "Rl", {skipna: true}]
      RAs: [sumNA, "Rs", {skipna: true}]
    sampling_period: "09-01"
    NApct_lim: 3
    NAyear_lim: 10
  P2:
    funct:
      mean-RA:  [mean, "RA",  {skipna: true}]
      mean-RAl: [mean, "RAl", {skipna: true}]
      mean-RAs: [mean, "RAs", {skipna: true}]
    time_step: none
  P3:
    funct:
      Rl_ratio: [divided, "mean-RAl", "mean-RA"]
      Rs_ratio: [divided, "mean-RAs", "mean-RA"]
    time_step: none
