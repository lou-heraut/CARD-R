id: CRS_season
version: "1.0"
authors: []
date: "2026-04-26"

meta:
  en:
    variable: [CRS_DJF, CRS_MAM, CRS_JJA, CRS_SON]
    unit: "without unit"
    name:
      - Winter precipitation correction coefficient
      - Spring precipitation correction coefficient
      - Summer precipitation correction coefficient
      - Autumn precipitation correction coefficient
    description: ""
    method: ""
    sampling_period:
      - ["12-01", "02-28(29)"]
      - ["03-01", "05-31"]
      - ["06-01", "08-31"]
      - ["09-01", "11-30"]
    topic: "Precipitations, Moderate, Parameterization"

  fr:
    variable: [CRS_DJF, CRS_MAM, CRS_JJA, CRS_SON]
    unit: "sans unité"
    name:
      - Coefficient correctif des précipitations hivernales
      - Coefficient correctif des précipitations printanières
      - Coefficient correctif des précipitations estivales
      - Coefficient correctif des précipitations automnales
    description: ""
    method: ""
    sampling_period:
      - ["01-12", "28(29)-02"]
      - ["01-03", "31-05"]
      - ["01-06", "31-08"]
      - ["01-09", "30-11"]
    topic: "Précipitations, Modérée, Paramétrisation"

  global:
    input_vars: "R_obs, R_sim"
    to_normalise: false
    palette: ["#452C1A", "#7F4A23", "#B3762A", "#D4B86A", "#EFE0B0",
              "#BCE6DB", "#7ACEB9", "#449C93", "#2A6863", "#193830"]

process:
  P1:
    funct:
      RSA_obs: [sumNA, "R_obs", {skipna: true}]
      RSA_sim: [sumNA, "R_sim", {skipna: true}]
    time_step: year-season
    Seasons: [DJF, MAM, JJA, SON]
    NApct_lim: 3
    NAyear_lim: 10
    compress: true

  P2:
    funct:
      mean-RSA_obs_DJF: [mean, "RSA_obs_DJF", {skipna: true}]
      mean-RSA_obs_MAM: [mean, "RSA_obs_MAM", {skipna: true}]
      mean-RSA_obs_JJA: [mean, "RSA_obs_JJA", {skipna: true}]
      mean-RSA_obs_SON: [mean, "RSA_obs_SON", {skipna: true}]
      mean-RSA_sim_DJF: [mean, "RSA_sim_DJF", {skipna: true}]
      mean-RSA_sim_MAM: [mean, "RSA_sim_MAM", {skipna: true}]
      mean-RSA_sim_JJA: [mean, "RSA_sim_JJA", {skipna: true}]
      mean-RSA_sim_SON: [mean, "RSA_sim_SON", {skipna: true}]
    time_step: none

  P3:
    funct:
      CRS_DJF: [divided, "mean-RSA_sim_DJF", "mean-RSA_obs_DJF"]
      CRS_MAM: [divided, "mean-RSA_sim_MAM", "mean-RSA_obs_MAM"]
      CRS_JJA: [divided, "mean-RSA_sim_JJA", "mean-RSA_obs_JJA"]
      CRS_SON: [divided, "mean-RSA_sim_SON", "mean-RSA_obs_SON"]
    time_step: none
