id: epsilon_R
version: "1.0"
authors: []
date: "2026-04-26"

meta:
  en:
    variable: epsilon_R
    unit: without unit
    name: Annual flow elasticity to precipitation
    description: ""
    method: "1. annual aggregation [Month of minimum monthly flows] - mean flow and mean total precipitation\n2. no temporal aggregation - calculation of elasticity ε"
    sampling_period: Month of minimum monthly flows
    topic: "Flow / Precipitations, Sensitivity to Climate Variability"

  fr:
    variable: epsilon_R
    unit: sans unité
    name: Élasticité annuelle du débit aux précipitations
    description: ""
    method: "1. agrégation annuelle [Mois du minimum des débits mensuels] - débit moyen et précipitations totales moyennes\n2. aucune agrégation temporelle - calcul de l'élasticité ε"
    sampling_period: Mois du minimum des débits mensuels
    topic: "Débit / Précipitations, Sensibilité à la variabilité climatique"

  global:
    input_vars: "Q, R"
    source: |
      SANKARASUBRAMANIAN, A., R. M. VOGEL et J. F. LIMBRUNNER (1991). « Climate elasticity of streamflow in the United States ». In : Water Resour. Res. 37, p. 1771-1781.

process:
  P1:
    funct:
      QA: [mean, "Q", {skipna: true}]
      RA: [mean, "R", {skipna: true}]
    sampling_period:
      type: adaptive
      funct: [min, "Q", {skipna: true}]
    NApct_lim: 3
    NAyear_lim: 10
  P2:
    funct:
      epsilon_R: [compute_elasticity, {Q: "QA", X: "RA"}]
    time_step: none
    NApct_lim: 3
